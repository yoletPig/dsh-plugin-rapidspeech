# Builds the native rs-server per platform and attaches it to the GitHub Release.
# Assets follow the name convention the plugin downloads by default:
#   rapidspeech-linux-x64.tar.gz   (rs-server + shared libraries at the archive root)
name: build-native

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Checkout RapidSpeech.cpp (with ggml and cppjieba submodules)
        run: git clone --depth 1 --recursive --shallow-submodules https://github.com/RapidAI/RapidSpeech.cpp.git upstream

      - name: Configure and build rs-server
        run: |
          cd upstream
          cmake -B build -DRS_STATIC_EXE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target rs-server -j"$(nproc)"

      - name: Package the self-contained binary (flat archive root)
        run: |
          # RS_STATIC_EXE links ggml and rapidspeech-core statically; the binary
          # only needs system libraries (glibc/libstdc++/libgomp).
          UP_COMMIT=$(git -C upstream rev-parse --short HEAD)
          {
            echo "rs-server built from RapidAI/RapidSpeech.cpp @ ${UP_COMMIT}"
            echo "https://github.com/RapidAI/RapidSpeech.cpp"
            echo
            echo "Upstream metadata declares the Apache license (setup.py) but the"
            echo "repository shipped no license text at build time; see the upstream"
            echo "repository for the authoritative terms. ggml (statically linked)"
            echo "is MIT; its text ships as ggml-LICENSE."
            echo
            echo "ASR models are NOT redistributed here; they download from the"
            echo "official RapidAI repositories at first use with user consent."
          } > NOTICE.txt
          mkdir -p pkg
          cp upstream/build/rs-server pkg/
          cp NOTICE.txt pkg/
          cp upstream/ggml/LICENSE pkg/ggml-LICENSE
          # Ship the upstream license too once the repository adds one.
          if [ -f upstream/LICENSE ]; then cp upstream/LICENSE pkg/rapidspeech-LICENSE; fi
          tar -czf rapidspeech-linux-x64.tar.gz -C pkg .
          sha256sum rapidspeech-linux-x64.tar.gz

      - name: Smoke test the packaged binary
        run: |
          mkdir -p /tmp/pkgcheck/bin && tar -xzf rapidspeech-linux-x64.tar.gz -C /tmp/pkgcheck/bin
          test -x /tmp/pkgcheck/bin/rs-server
          /tmp/pkgcheck/bin/rs-server --help > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: rapidspeech-linux-x64
          path: rapidspeech-linux-x64.tar.gz

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v pat="^## $VERSION" '
            $0 ~ pat { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Fall back when the tag has no curated section yet.
          [ -s release-notes.md ] || echo "See CHANGELOG.md for the full notes." > release-notes.md

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: rapidspeech-linux-x64.tar.gz
          body_path: release-notes.md
          # Appends GitHub's auto "What's Changed" (commits since the last tag)
          # below the curated notes.
          generate_release_notes: true

  plugin-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build and test
        run: |
          npm ci
          npm run build
          npm test

      - name: Pack the installable tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pack --pack-filename "dsh-plugin-rapidspeech-${VERSION}.tgz"
          sha256sum "dsh-plugin-rapidspeech-${VERSION}.tgz"

      - uses: actions/upload-artifact@v7
        with:
          name: dsh-plugin-rapidspeech-tgz
          path: dsh-plugin-rapidspeech-*.tgz

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dsh-plugin-rapidspeech-*.tgz
          body_path: release-notes.md
          generate_release_notes: true

  win32-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout RapidSpeech.cpp (with ggml and cppjieba submodules)
        run: git clone --depth 1 --recursive --shallow-submodules https://github.com/RapidAI/RapidSpeech.cpp.git upstream

      - name: Configure and build rs-server.exe
        run: |
          cd upstream
          cmake -B build -DRS_STATIC_EXE=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --target rs-server --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Package the self-contained binary (flat archive root)
        shell: pwsh
        run: |
          # MSVC is a multi-config generator: the exe lands in build\Release\.
          $upCommit = git -C upstream rev-parse --short HEAD
          $lines = @(
            "rs-server built from RapidAI/RapidSpeech.cpp @ $upCommit"
            "https://github.com/RapidAI/RapidSpeech.cpp"
            ""
            "Upstream metadata declares the Apache license (setup.py) but the repository"
            "shipped no license text at build time; see the upstream repository for the"
            "authoritative terms. ggml (statically linked) is MIT; its text ships as"
            "ggml-LICENSE."
            ""
            "ASR models are NOT redistributed here; they download from the official"
            "RapidAI repositories at first use with user consent."
          )
          $lines | Set-Content NOTICE.txt
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item upstream\build\Release\rs-server.exe pkg\
          Copy-Item NOTICE.txt pkg\
          Copy-Item upstream\ggml\LICENSE pkg\ggml-LICENSE
          if (Test-Path upstream\LICENSE) { Copy-Item upstream\LICENSE pkg\rapidspeech-LICENSE }
          tar -czf rapidspeech-win32-x64.tar.gz -C pkg .
          Get-FileHash rapidspeech-win32-x64.tar.gz

      - name: Smoke test the packaged binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\pkgcheck\bin | Out-Null
          tar -xzf rapidspeech-win32-x64.tar.gz -C C:\pkgcheck\bin
          & C:\pkgcheck\bin\rs-server.exe --help | Out-Null

      - uses: actions/upload-artifact@v7
        with:
          name: rapidspeech-win32-x64
          path: rapidspeech-win32-x64.tar.gz

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: rapidspeech-win32-x64.tar.gz
          body_path: release-notes.md
          generate_release_notes: true
